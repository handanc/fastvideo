# 1080P 商业级档（`--resolution 1080P` / `FV3_RESOLUTION=1080P`）：对标主流商业 AI 短剧的模型栈。
# 选型依据（2026-08 实测与文档调研）：
#   - 运动/口型：wan3.0-video（台词写进提示词、模型自发声 → 一条调用出口型+动作+音轨；2026-11-04 起这是唯一口型通道，A/B 链已删除）
#   - 角色一致性：wan2.7-r2v 参考生视频（像素级形象一致，商业管线的"角色资产"引擎）
#   - 抽卡选优：每镜头 2 候选 + VLM 打分取优（商业团队「反复抽卡」的工程化等价；模型名见 .env 的 FV3_VLM_MODEL）
# 成本量级：1080P 约 ¥1/秒，90 秒片含抽卡约 ¥150-260，用 --budget 300 跑。
providers:
  # 文生图**不在这里各档一份**（2026-10-17）：三档共用 configs/default.yaml 的
  # `providers.t2i` + `models.dashscope_t2i27`，而新建任务时「模型选择」点的那名压过一切
  # （`core/config.py:apply_run_overrides` 是唯一恢复入口）。各档写一份的实际代价：路由早已
  # 三档相同、models 却各写各的，于是面板"默认 wanx2.1-t2i-plus"而这条 run 打的是
  # wan2.7-image —— 用户在错的基线上做选择。
  i2v: {default: dashscope_wan27_i2v}   # 兜底 wan2.2 已删：换模型=换画面语法
  # 口型：**模式自己就是通道选择器**（唯一映射表 core/talkmode.py）。
  # 本文件只决定 1080P 档的默认模型与一致性深度；口型恒为 C 链 wan3.0-video（图片+提示词
  # 台词在里面 → 一条调用出口型+动作+音轨，原生 1080P、多人同屏有解，音轨为模型原声）。
  # 历史包袱已清：A 链 wan2.2-s2v（只到 720P、单人同屏）、B 链 videoretalk（两段付费最慢、
  #   要求运动片段边长 ≥640，本档曾是它的默认）、wan2.7 driving_audio 与第三方口型（fal/可灵）
  #   已于 2026-11-04 全部移除 → **本档没有兜底通道**，主通道失败即降级叠音并落
  #   degradations.json（看板红标），不会再出现"先烧一份运动片段的钱、再 100% 无口型"。
  talk: {default: dashscope_wan30_talk}
  r2v: {default: dashscope_wan27_r2v}
  # tts 继承 default.yaml：主 = cosyvoice-v2、兜底 = edge-tts（三档同一套配音口径）

generation:
  # 成片尺寸不写在这里：唯一来源是 core/config.py 的 RESOLUTION_SIZES（分辨率×画幅）。
  # 两处都写就会出现「面板显示 720P、实际按 1080P 出片」（这条 bug 修过一次）。
  i2v_resolution: 1080P
  use_reference_keyframes: true   # 首帧带角色立绘参考图（硬锁脸）
  require_reference_keyframes: true  # 硬门控：t2i 主供应商不支持参考图 → 花钱前报错
  consistency_gate: reshoot       # 不达标镜头自动带参考图重做（≤2 轮），仍不过则标不合格
  scene_ref_mode: scenery_only    # 场景图只喂空镜；all 需 m9 证明人脸不降才允许
  ref_max_chars: 1   # 多图协议待 scripts/probe_multi_ref.py 探单通过后再放开到 2（风险 R1）
  # 本档对白镜头的画面与口型由 C 链一次调用直出（ wan3.0-video：提示词里带台词），
  # 不需要再单独跑口型步；只有**无台词**的动作镜头才过 m4 i2v 出运动片段。
  # （本档历史上默认走 B 链 v2v_overlay，要求运动片段边长 ≥640；该链已于 2026-11-04 移除。）
  # C 链的成片音轨：**model = 保留模型自发声（默认）** | master = 换回 m5 的 TTS 母带。
  # 不换母带是实测结论：换了以后语音领先口型 0～2.2 秒且每镜偏移不同（测量表在
  # core/talkmode.py）。要"音色统一 + 嘴型对着这条配音"在现通道下**做不到**：原先指路
  # B 链 v2v_overlay，该链已于 2026-11-04 移除；现在只能接受模型原声，或用
  # reference_audio 克隆音色（嘴型仍对模型自己的发声，且与首尾帧互斥）。
  use_r2v_for_characters: true
  keyframe_seed_scope: cast      # 同角色跨场景同种子（旧 scene_cast 换场景即换脸）
  asset_style_gate: warn         # 立绘写实闸门：动漫/3D 立绘记事件+降级台账
  look_extraction: true          # 结构化外貌卡（蒸馏校验 + 度量属性来源）
  consistency_metric: full       # 全检 + 自校准锚 + 顺序互换 + 双人二选一
  candidates_per_shot: 2
  asset_candidates: 2            # 角色立绘抽卡选优（源头闸门，<¥1/片）
  storyboard_sample_rate: 1.0    # VLM 一致性全检
  style_suffix: >-
    真人写实电影剧照，院线级画质，自然皮肤纹理，电影级三点布光，
    柔和胶片颗粒，浅景深，高动态范围，色彩科学参考ARRI Alexa，
    photorealistic live-action film still, shot on 35mm lens, realistic human skin,
    natural color grading, no animation, no CGI look
  negative_prompt: >-
    卡通，动漫，二次元，插画，手绘，3D渲染，CG感，塑料感，蜡像感，皮克斯风格，Q版，
    低质量，模糊，畸形，多余手指，脸部崩坏，字幕，水印，logo，过曝，
    cartoon, anime, 3d render, pixar style, disney style, illustration, painting
  color_grade: true
  loudnorm: true
  encode_crf: 20
  encode_preset: veryfast
  bgm_volume: 0.12

models:
  # 文生图的两个键都不在这里写（2026-10-17）：三档共用 default.yaml 那一份，
  # 想换就在新建任务的「模型选择」里点名 —— 一个旋钮，不会出现"这档一个名、那档另一个名"。
  dashscope_i2v: wan3.0-video         # 场景级生成的模型名（与 model_for("i2v") 同键）
  dashscope_r2v: wan2.7-r2v
  dashscope_vlm: qwen-vl-max     # 兑现"抽卡打分取优"设计（此前静默继承 plus 档）
